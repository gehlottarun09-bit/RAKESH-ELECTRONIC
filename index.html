<!DOCTYPE html>
<html>
<head>
<title>Rakes Electronic</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{font-family:Arial;margin:0;padding:0;background:#f4f4f4}
h1{text-align:center;padding:15px;background:#111;color:white}
.container{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:15px;padding:15px}
.card{background:white;padding:10px;border-radius:8px;box-shadow:0 2px 5px rgba(0,0,0,0.1)}
.card img{width:100%;height:150px;object-fit:cover;border-radius:5px}
button{background:#0f9d58;color:white;border:none;padding:8px;width:100%;border-radius:5px;cursor:pointer}
button:hover{opacity:0.9}
</style>
</head>

<body>

<h1>Rakes Electronic</h1>
<div class="container" id="products"></div>

<script>
const sheetURL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSbv4RxA77DxxC7Jfr6GS0BmP_NjhaJWk5GJu2GYu3hBMzcw9p2QRk_Dn3j1Gk7uvp9AIcneXge6Saz/pubhtmlv=csv";

fetch(sheetURL)
.then(response => response.text())
.then(data => {
  const rows = data.split("\n").slice(1);
  let output = "";
  rows.forEach(row => {
    const cols = row.split(",");
    const name = cols[1];
    const category = cols[2];
    const price = cols[3];
    const description = cols[4];
    const image = cols[5];

    if(name){
      output += `
        <div class="card">
          <img src="${image}" alt="">
          <h3>${name}</h3>
          <p>₹${price}</p>
          <p>${description}</p>
          <button onclick="pay('${price}')">Buy Now</button>
        </div>
      `;
    }
  });
  document.getElementById("products").innerHTML = output;
});

function pay(amount){
  window.location.href=`upi://pay?pa=9996002994-1@okbizaxis&pn=RakesElectronic&am=${amount}&cu=INR`;
}
</script>

</body>
</html>
